<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحدّي جزء عمّ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* Layout: teal header band, white progress card, four tabs, single column of cards (max 720px). One light theme by choice. */
:root{
  --ink:#1B2A2F; --muted:#4F6568; --teal:#0D4A4C; --teal-2:#176B69; --paper:#F4F8F6; --card:#FFFFFF;
  --line:#BFD3CF; --gold:#F2B31F; --cream:#FFF4D6;
  --ok:#14684A; --ok-bg:#DDF1E6; --wait:#7A5200; --wait-bg:#FFEFC2; --ready:#12466F; --ready-bg:#DCEBF8;
  --x1:#FFFFFF; --x2:#E6F2EF; --x3:#D2E8E3;
  --display:'Lalezar','Cairo',sans-serif; --body:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{direction:ltr}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}

/* header */
.hero{position:relative;background:var(--teal);overflow:hidden;color:#fff}
.hero svg.pat{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;max-width:720px;margin:0 auto;padding:12px 16px 44px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.hero h1{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1;color:var(--cream)}
.hero .sub{color:#F5C242;font-weight:800;font-size:14px}
.who{display:inline-flex;align-items:center;gap:8px;margin-top:4px;min-height:32px;padding:0 12px;border:2px solid rgba(255,255,255,.55);border-radius:99px;background:transparent;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.hbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.hbtns .hl{align-self:center;font-size:13px;font-weight:700;color:var(--cream)}
.hbtns .who[aria-pressed=true]{background:#fff;color:var(--teal);border-color:#fff}
.hbtns .who{margin-top:0;font-size:13px;min-height:30px;padding:0 10px}
.who small{font-size:12px;opacity:.8}
.score{text-align:center;min-width:96px}
.score b{display:block;font-family:var(--display);font-weight:400;font-size:48px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.score span{font-weight:700;font-size:14px;color:var(--cream)}
.reg .score,.reg .progress,.reg .tabs{display:none}
.reg .hero .in{padding-bottom:28px}

/* progress */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.progress{margin-top:-32px;position:relative;padding:12px 14px}
.reg .wrap{padding-top:16px}
.track{display:flex;gap:3px;height:16px}
.seg{flex:1 1 0;background:color-mix(in srgb,var(--c) 18%,#fff);border-radius:4px;overflow:hidden;display:flex}
.seg:first-child{border-radius:0 9px 9px 0}.seg:last-child{border-radius:9px 0 0 9px}
.seg i{display:block;height:100%;background:var(--c)}
.marks{display:flex;gap:3px;margin-top:6px}
.mark{flex:1 1 0;min-width:0;text-align:end;color:var(--c);line-height:1.2}
.mark b{display:block;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.mark span{display:none;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:15px}
.next span{color:var(--muted)}.next b{font-weight:800}.next em{font-style:normal;color:var(--teal-2);font-weight:700}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:5px;margin:10px -16px 0;padding:6px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.tab{flex:1 1 0;min-width:0;min-height:40px;padding:6px 2px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:800;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #1F6FB5;outline-offset:2px}
.kids{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kids button{min-height:38px;padding:0 14px;border:2px solid var(--line);border-radius:99px;background:#fff;font-weight:800;font-size:14px;color:var(--teal);cursor:pointer}
.kids button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.kids button.add{border-style:dashed}
.kids:empty{display:none}
.kids .kl{align-self:center;font-size:14px;font-weight:800;color:var(--muted)}
.kids button.rs{border-color:#9B2226;color:#9B2226}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.sync{margin:0;font-size:13px;color:var(--muted)}
.mode{display:inline-flex;border:2px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.mode button{border:0;background:#fff;padding:2px 14px;min-height:36px;font-weight:800;font-size:14px;cursor:pointer;color:var(--teal)}
.mode button[aria-pressed=true]{background:var(--teal);color:#fff}
.mode .ml{display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:700;color:var(--muted);background:var(--paper)}
.fold>summary{font-size:19px;font-weight:800;color:var(--teal);cursor:pointer;min-height:32px;display:flex;align-items:center}
.fold[open]>summary{margin-bottom:6px}
body.phone .wrap,body.phone .hero .in{max-width:480px}
.sync.warn{color:#8A3B00;font-weight:700}
#view{display:flex;flex-direction:column;gap:12px;margin-top:8px}

/* next reward card + path */
.nextc{display:grid;grid-template-columns:1fr 104px;gap:10px;align-items:center;border:3px solid var(--c);background:var(--t)}
.nextc .k{font-size:13px;font-weight:800;color:var(--muted)}
.nextc h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;color:var(--tt);margin:0}
.nextc .cheer{font-size:15px;font-weight:700;margin-top:6px}
.nextc .pt{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--tt);margin-top:4px;font-variant-numeric:tabular-nums}
.rbar{height:12px;background:color-mix(in srgb,var(--c) 22%,#fff);border-radius:99px;overflow:hidden;margin-top:8px}
.rbar i{display:block;height:100%;background:var(--c);border-radius:99px}
.path h2{font-size:19px;font-weight:800;color:var(--teal);margin-bottom:8px}
.prow{display:grid;grid-template-columns:minmax(84px,118px) 1fr minmax(76px,104px);gap:10px;align-items:center;padding:6px 0;border-top:1px solid #E3ECEA}
.prow:first-of-type{border-top:0}
.prow .pn{font-weight:800;font-size:14px;color:var(--c)}
.prow .rbar{margin:0;height:10px}
.prow .pl{font-size:13px;font-weight:700;color:var(--muted);text-align:end}
.prow .pl.ok{color:var(--ok)}

/* block card + rows */
.blk h2{font-size:20px;font-weight:800;color:var(--teal)}
.blk .meta{color:var(--muted);font-size:14px}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sur{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--x1)}
.sur.m2{background:var(--x2)}.sur.m3{background:var(--x3)}
.sur.locked{opacity:.62}
.sur.ready{border:2px solid var(--ready);background:var(--ready-bg)}
.sur[data-tap]{cursor:pointer}
.sur .n{width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.sur .nm{font-family:var(--display);font-size:26px;line-height:1.15;color:var(--teal)}
.sur .mt{font-size:13px;color:var(--muted)}
.sur .info{font-size:13px;font-weight:700;color:var(--ink)}
.sur .act{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:112px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 14px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.btn.alt{background:var(--ready)}
.btn.ghost{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.btn.danger{background:#9B2226}
.btn[disabled]{background:#DCE5E3;color:#5C6F6D;cursor:not-allowed}
.btn small{font-weight:600;opacity:.8}
.link{background:none;border:0;padding:4px;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.wait{background:var(--wait-bg);color:var(--wait)}
.tag.lock{background:#E7ECEB;color:#4A5C5B}
.tag.open{background:var(--gold);color:#3A2800}
.ic{width:16px;height:16px;flex:none}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.hint{flex:1 1 220px;font-size:14px;color:var(--muted)}

/* all surahs */
details.grp{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
details.grp summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer;font-weight:800;color:var(--teal);min-height:48px}
details.grp .rows{margin:0;padding:0 12px 12px}

/* rewards */
.reward{display:grid;grid-template-columns:84px 1fr 96px;border:3px solid var(--c);border-radius:18px;background:var(--t);overflow:hidden}
.reward .rn{background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.reward .rn b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.reward .rn span{font-size:13px;font-weight:800}
.reward .rb{padding:10px 12px;display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0}
.reward h3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;color:var(--tt)}
.reward p{font-size:14px;font-weight:700}
.reward .ra{display:flex;align-items:center;justify-content:center;padding:6px}
.art{width:100%;height:auto;max-width:96px}
.reward.locked{background:#EEF2F1;border-color:#B9C7C4}
.reward.locked .rn{background:#7C9290}
.reward.locked h3{color:#4A5C5B}
.reward.locked .art{filter:grayscale(1);opacity:.45}
.reward.open{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 28%,transparent)}

/* parents + forms */
.card h2{font-size:19px;font-weight:800;color:var(--teal);margin-bottom:6px}
.card p,.card li{font-size:15px}
.card ul{margin:6px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.card .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.card.danger{border-color:#E3B5B7}
.form{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.form label,.form legend{font-weight:700;font-size:15px}
.form input[type=text],.form input[type=password],.form textarea{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
.form input.pinf{letter-spacing:.5em;text-align:center;font-size:22px}
.form textarea{min-height:120px;font-size:13px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace}
.form fieldset{border:2px solid var(--line);border-radius:12px;padding:6px 12px;margin:0;display:flex;gap:20px;align-items:center}
.form fieldset label{display:flex;align-items:center;gap:8px;min-height:40px}
.form fieldset input{width:20px;height:20px}
.err{color:#9B2226;font-weight:700;font-size:14px}
.err:empty{display:none}
.err:not(:empty){background:#FBE9EA;border:1px solid #E3B5B7;border-radius:10px;padding:8px 12px}
.form input.bad{border-color:#9B2226;background:#FFF6F6}

.nextc.noart{grid-template-columns:1fr}
.reward.noart{grid-template-columns:84px 1fr}
@media (min-width:560px){.reward.noart{grid-template-columns:104px 1fr}}
/* guide */
.steps{list-style:none;counter-reset:st;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:st;position:relative;padding-inline-start:44px;font-size:15px}
.steps li::before{content:counter(st);position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.steps b{display:block;font-size:16px;color:var(--teal)}
.ptable{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.ptable td,.ptable th{border:1px solid var(--line);padding:4px 8px;text-align:center}
.ptable th{background:var(--x2)}
.gbox{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--cream);font-size:14px;font-weight:700;color:#5C4200}
.rwf{display:flex;flex-direction:column;gap:6px;padding:10px;border:2px solid var(--c);border-radius:14px;background:var(--t)}
.rwf label{font-weight:700;font-size:14px}
.rwf input[type=text],.rwf select{width:100%;min-height:44px;border:2px solid var(--line);border-radius:10px;padding:4px 10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
/* modal + toast */
#modal .ov{position:fixed;inset:0;z-index:20;background:rgba(13,42,43,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:100%;max-width:420px;max-height:90%;overflow:auto;background:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.dlg h2{font-size:21px;font-weight:800;color:var(--teal);margin:0}
.dlg input[type=password].big{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-size:24px;letter-spacing:.5em;text-align:center;font-family:var(--body)}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap}
.dlg .art{max-width:140px;align-self:center}
.dlg .plist{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;min-height:48px}
.chk input{width:22px;height:22px}
.chk .nm{font-family:var(--display);font-size:22px;color:var(--teal);flex:1}
.toast{position:fixed;bottom:16px;left:16px;right:16px;margin:0 auto;max-width:420px;z-index:30;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
body.pc{font-size:16px}
body.pc .wrap,body.pc .hero .in{max-width:1700px;padding-inline:28px}
body.pc .hero .in{padding-top:8px;padding-bottom:40px}
body.pc .hero h1{font-size:38px}
body.pc .hero .sub{font-size:14px}
body.pc .score b{font-size:44px}
body.pc .score{min-width:80px}
body.pc .tabs{margin-inline:-28px;padding-inline:28px;justify-content:center;margin-top:8px;padding-block:6px}
body.pc .tab{flex:0 1 220px;font-size:16px;min-height:38px}
body.pc .progress{padding:10px 22px;margin-top:-30px}
body.pc .track{height:14px}
body.pc .mark b{font-size:14px}
body.pc .mark span{font-size:12px}
body.pc .next{margin-top:6px}
body.pc .tools{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:6px}
body.pc .tools .kids{margin-top:0}
body.pc .tools .bar{margin-top:0;gap:16px}
body.pc #view{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px;align-items:start;margin-top:8px}
body.pc #view[data-tab=home]{grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-rows:auto 1fr}
body.pc #view[data-tab=home] .blk{grid-column:1;grid-row:1/span 2}
body.pc #view[data-tab=home] .nextc{grid-column:2;grid-row:1}
body.pc #view[data-tab=home] .path{grid-column:2;grid-row:2}
body.pc #view[data-tab=home]>section:not(.blk):not(.nextc):not(.path){grid-column:1/-1}
body.pc #view[data-tab=home] .blk .rows,body.pc details.grp[open] .rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
body.pc #view[data-tab=guide]{grid-template-columns:minmax(0,1fr)}
body.pc #view[data-tab=guide] .steps,body.pc.reg .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 28px}
body.pc.reg #view{display:flex;flex-direction:column;align-items:stretch;max-width:1000px;margin-inline:auto}
body.pc #regForm,body.pc #setupForm,body.pc #rwForm{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 20px}
body.pc #regForm{grid-template-columns:1fr 1fr}
body.pc #regForm>.err,body.pc #regForm>.row,body.pc #setupForm>.err,body.pc #setupForm>.row,body.pc #rwForm>.err,body.pc #rwForm>.row{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px}
body.pc .reward{grid-template-columns:100px 1fr 110px}
body.pc .reward.noart{grid-template-columns:100px 1fr}
body.pc .sur .act{min-width:136px}
body.pc #view[data-tab=all]{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
body.pc details.grp[open]{grid-column:1/-1}
body.phone .reward .rb{padding:6px 10px;gap:2px}
body.phone .reward .rn b{font-size:28px}
body.phone .reward .ra svg{max-height:64px;width:auto}
@media (min-width:560px){
  .mark span{display:block}
  .reward{grid-template-columns:104px 1fr 130px}
  .hero h1{font-size:40px}
}
@media (max-width:420px){
  .sur .act{min-width:96px}
  .sur .nm{font-size:23px}
  .score b{font-size:44px}
  .hero h1{font-size:28px}
  .nextc{grid-template-columns:1fr 84px}
}
</style>
</head>
<body dir="rtl">
<header class="hero">
  <svg class="pat" aria-hidden="true">
    <defs><pattern id="kh" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect x="14" y="14" width="36" height="36" fill="none" stroke="#1D7A78" stroke-width="1.6"/>
      <rect x="14" y="14" width="36" height="36" fill="none" stroke="#1D7A78" stroke-width="1.6" transform="rotate(45 32 32)"/>
      <circle cx="32" cy="32" r="3.5" fill="#1D7A78"/>
      <circle cx="0" cy="0" r="3" fill="#176B69"/><circle cx="64" cy="0" r="3" fill="#176B69"/>
      <circle cx="0" cy="64" r="3" fill="#176B69"/><circle cx="64" cy="64" r="3" fill="#176B69"/>
    </pattern></defs>
    <rect width="100%" height="100%" fill="url(#kh)"/>
  </svg>
  <div class="in">
    <div>
      <h1>تحدّي جزء عمّ</h1>
      <div class="sub">الحفظ · المراجعة · الجوائز</div>
    </div>
    <div class="score"><b id="pts">0</b><span id="ptsLbl">نقطة</span></div>
  </div>
</header>

<main class="wrap">
  <section class="card progress" aria-label="التقدّم نحو الجوائز">
    <div id="progress"></div>
    <div class="next" id="nextBox"></div>
  </section>
  <nav class="tabs" role="tablist" aria-label="الأقسام">
    <button class="tab" role="tab" data-act="tab" data-tab="home">مسيرتي</button>
    <button class="tab" role="tab" data-act="tab" data-tab="all">السور</button>
    <button class="tab" role="tab" data-act="tab" data-tab="rewards">الجوائز</button>
    <button class="tab" role="tab" data-act="tab" data-tab="parents">الأهل</button>
    <button class="tab" role="tab" data-act="tab" data-tab="guide">القواعد</button>
  </nav>
  <div class="tools"><div class="kids" id="kids"></div>
  <div class="bar"><p class="sync" id="sync"></p><div class="mode" role="group" aria-label="طريقة العرض"><span class="ml">العرض</span><button type="button" data-act="mode" data-m="phone" aria-pressed="false">هاتف</button><button type="button" data-act="mode" data-m="pc" aria-pressed="false">حاسوب</button></div></div>
  </div>
  <div id="view"></div>
</main>

<div id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ayatTxt(n){return n===1?'آية واحدة':n===2?'آيتان':(n>=3&&n<=10)?n+' آيات':n+' آية'}
function ptsTxt(n){return n===1?'نقطة واحدة':n===2?'نقطتان':(n>=3&&n<=10)?n+' نقاط':n+' نقطة'}
function daysTxt(n){return n===1?'يوم واحد':n===2?'يومين':(n>=3&&n<=10)?n+' أيام':n+' يومًا'}
function sourTxt(n){return n===1?'سورة واحدة':n===2?'سورتان':(n>=3&&n<=10)?n+' سور':n+' سورة'}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function parts(s){return s.split('-').map(Number)}
function addDays(s,n){var p=parts(s);return iso(new Date(p[0],p[1]-1,p[2]+n))}
function daysBetween(a,b){var f=function(s){var p=parts(s);return Date.UTC(p[0],p[1]-1,p[2])};return Math.round((f(b)-f(a))/864e5)}
function fmt(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

var LS='juz-amma-v3';
var store={v:3,active:'',profiles:[],lastBackup:'',dead:{}};
var sync={ref:null,ready:false,busy:false,dirty:false,err:''};
var P=null, state=emptyProfile(), storageOK=true, tab='home';
function emptyProfile(){return{id:'',parent:'',child:'',pin:'',s:{},b:{},rw:{},rwc:{},start:'',ts:0}}
function fixProfile(p){p=p||{};return{id:p.id||uid(),parent:String(p.parent||''),child:String(p.child||''),pin:p.pin||'',s:p.s||{},b:p.b||{},rw:p.rw||{},rwc:p.rwc||{},rwSet:p.rwSet===undefined?true:!!p.rwSet,start:p.start||'',ts:Number(p.ts)||0}}
function loadStore(){
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}
  try{
    var raw=localStorage.getItem(LS);
    if(raw){var o=JSON.parse(raw);if(o&&o.v===3&&Array.isArray(o.profiles)){store={v:3,active:o.active||'',profiles:o.profiles.map(fixProfile),lastBackup:o.lastBackup||'',dead:o.dead||{}}}}
  }catch(e){}
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(store));storageOK=true}catch(e){storageOK=false}}
function saveStore(){saveLocal();scheduleSync()}
/* ---- sync across devices (same claude.ai account, private per-account doc) ---- */
function sig(st){return JSON.stringify([st.profiles.map(function(p){return[p.id,p.ts]}).sort(),st.dead,st.lastBackup])}
function mergeStores(a,b){
  var dead={},map={},order=[];
  [a.dead||{},b.dead||{}].forEach(function(d){Object.keys(d).forEach(function(k){dead[k]=Math.max(dead[k]||0,d[k])})});
  [a.profiles,b.profiles||[]].forEach(function(list){list.forEach(function(p){
    p=fixProfile(p);
    if(!map[p.id]){order.push(p.id);map[p.id]=p}else if(p.ts>map[p.id].ts)map[p.id]=p;
  })});
  return{profiles:order.map(function(id){return map[id]}).filter(function(p){return !(dead[p.id]&&dead[p.id]>=p.ts)}),dead:dead,lastBackup:[a.lastBackup,b.lastBackup||''].sort().pop()||''};
}
function scheduleSync(){if(!sync.ref||!sync.ready)return;sync.dirty=true;pump()}
async function pump(){
  if(sync.busy||!sync.dirty)return;
  sync.busy=true;sync.dirty=false;
  try{await sync.ref.set(clone(store));sync.err='';sync.fails=0}
  catch(e){
    sync.fails=(sync.fails||0)+1;
    if(sync.fails>=2){sync.ref=null;sync.ready=false;sync.dirty=false;sync.err='';sync.busy=false;setSync();if(P&&tab==='parents')render();return}
    sync.err='fail';sync.dirty=true;setTimeout(pump,3000);
  }
  sync.busy=false;setSync();
  if(sync.dirty&&!sync.err)pump();
}
function onRemote(sn){
  if(sn.metadata&&sn.metadata.fromCache)return;
  var remote=sn.exists?sn.data():null,before=sig(store);
  sync.err='';
  if(remote&&Array.isArray(remote.profiles)){
    var m=mergeStores(store,remote);
    store.profiles=m.profiles;store.dead=m.dead;store.lastBackup=m.lastBackup;
    var act=store.profiles.some(function(p){return p.id===store.active})?store.active:(store.profiles[0]?store.profiles[0].id:'');
    var wasWriting=!!document.querySelector('#modal:not([hidden]) form');
    setActive(act);saveLocal();
    var remoteSig=sig({profiles:remote.profiles.map(fixProfile),dead:remote.dead||{},lastBackup:remote.lastBackup||''});
    sync.ready=true;
    if(sig(store)!==remoteSig)scheduleSync();
    if(sig(store)!==before&&!wasWriting)render();else setSync();
  }else{
    sync.ready=true;
    if(store.profiles.length)scheduleSync();
    setSync();
  }
}
async function initSync(){
  try{
    if(!(window.claude&&claude.use))return;
    var db=await claude.use('db'),user=await claude.use('user');
    if(!db||!user)return;
    var id=await user.id();if(!id)return;
    sync.ref=db.doc('data/users/'+id+'/store');
    var timer=setTimeout(function(){if(!sync.ready){sync.err='timeout';setSync()}},10000);
    sync.ref.onSnapshot(function(sn){clearTimeout(timer);onRemote(sn)},function(){clearTimeout(timer);sync.err='fail';setSync()});
    setSync();
  }catch(e){sync.ref=null}
}
function setActive(id){
  P=null;
  for(var i=0;i<store.profiles.length;i++){if(store.profiles[i].id===id)P=store.profiles[i]}
  store.active=P?P.id:'';state=P||emptyProfile();
  applyRewards();
}

var ZERO={st:0};
function E(num){return state.s[num]||ZERO}
function blockItems(k){return LIST.slice(k*BL,k*BL+BL)}
function blockPassed(k){return !!(state.b[k]&&state.b[k].c)}
function blockUnlocked(k){return k===0||blockPassed(k-1)}
function blockComplete(k){return blockItems(k).every(function(s){return E(s.num).st===2})}
function curBlock(){for(var k=0;k<NB;k++){if(!blockPassed(k))return k}return -1}
function status(i){
  var s=LIST[i],e=E(s.num),k=Math.floor(i/BL);
  if(e.st===2)return'done';
  if(!blockUnlocked(k))return'lock-block';
  if(e.st===1)return'ready';
  return e.redo?'redo':'active';
}
function calc(){
  var scored=0,pts=0,recited=0,toLearn=0,passed=0,k;
  LIST.forEach(function(s){var e=E(s.num);if(e.f){scored++;pts+=s.pts}if(e.st===2)recited++;else toLearn+=s.ayat});
  for(k=0;k<NB;k++){if(blockPassed(k))passed++}
  var bonus=Math.min(3,Math.floor(scored/10))*50;
  return{scored:scored,recited:recited,pts:pts+bonus,base:pts,bonus:bonus,toLearn:toLearn,passed:passed};
}
function unlocked(r,c){return r.key==='final'?(c.passed===NB&&c.recited===LIST.length):c.pts>=r.th}
function unlockedKeys(){var c=calc();return REWARDS.filter(function(r){return unlocked(r,c)}).map(function(r){return r.key})}
function pctOf(r,c){
  if(unlocked(r,c))return 100;
  if(r.key==='final')return Math.min(99,Math.floor(c.recited/LIST.length*100));
  return Math.min(99,Math.floor(c.pts/r.th*100));
}
function leftTxt(r,c){
  if(r.key==='final')return c.recited<LIST.length?'تبقّى '+sourTxt(LIST.length-c.recited):'بقيت مراجعة المجموعة الأخيرة';
  return'تبقّى '+ptsTxt(r.th-c.pts);
}
function nextRewardObj(c){for(var i=0;i<REWARDS.length;i++){if(!unlocked(REWARDS[i],c))return REWARDS[i]}return null}
function nextSurah(){for(var i=0;i<LIST.length;i++){if(E(LIST[i].num).st!==2)return LIST[i]}return null}
function surahsToReach(th){
  var c=calc(),base=c.base,sc=c.scored,n=0,i,s,tot;
  for(i=0;i<LIST.length;i++){
    s=LIST[i];if(E(s.num).f)continue;
    base+=s.pts;sc++;n++;
    tot=base+Math.min(3,Math.floor(sc/10))*50;
    if(tot>=th)return n;
  }
  return 0;
}
function cheerLine(r,c){
  var pre=pctOf(r,c)>=85?'اقتربنا كثيرًا! ':'';
  if(r.key==='final'){var left=LIST.length-c.recited;return left>0?pre+'بقيت '+sourTxt(left)+' للحفلة الكبرى.':'بقيت مراجعة المجموعة الأخيرة فقط!'}
  var rem=r.th-c.pts,kk=curBlock(),ns=null;
  if(kk>=0)blockItems(kk).forEach(function(x){if(E(x.num).st!==2&&x.pts>=rem&&(!ns||x.pts<ns.pts))ns=x});
  if(ns)return pre+'سورة '+ns.name+' وحدها تعطيك '+ptsTxt(ns.pts)+' وتفتح هذه الجائزة!';
  var n=surahsToReach(r.th);
  return n?pre+'بعد حوالي '+sourTxt(n)+' جديدة تصل إلى الجائزة.':pre;
}

/* ---------- mutations ---------- */
function mutate(fn){
  if(!P){return false}
  fn();
  state.ts=Date.now();
  if(!state.start)state.start=today();
  saveStore();render();return true;
}

/* ---------- toast / modal ---------- */
var toastTimer;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},3000)}
var modalClose=null;
function openModal(html,onEsc){
  var m=document.getElementById('modal');
  m.innerHTML='<div class="ov"><div class="dlg" role="dialog" aria-modal="true">'+html+'</div></div>';
  m.hidden=false;modalClose=onEsc||closeModal;
  var f=m.querySelector('input,textarea,button');if(f)f.focus();
}
function closeModal(){var m=document.getElementById('modal');m.hidden=true;m.innerHTML='';modalClose=null}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modalClose)modalClose()});

function nd(v){return String(v).replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-0x0660}).replace(/[\u06F0-\u06F9]/g,function(c){return c.charCodeAt(0)-0x06F0}).replace(/\s+/g,'')}
function hashPin(p){var x=5381,s='juz|'+p;for(var i=0;i<s.length;i++){x=((x<<5)+x)^s.charCodeAt(i)}return(x>>>0).toString(36)+'.'+s.length}

function pinDialog(mode){
  return new Promise(function(res){
    var creating=mode==='create';
    function done(v){closeModal();res(v)}
    var html=creating
      ?'<h2>رمز جديد للأهل</h2><p>رمز من 4 أرقام.</p><form id="pinForm"><input class="big" id="p1" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="الرمز الجديد"><input class="big" id="p2" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="أعد كتابة الرمز" style="margin-top:8px"><p class="err" id="pe" role="alert"></p><div class="row"><button class="btn" type="submit">حفظ الرمز</button><button class="btn ghost" type="button" id="pc">إلغاء</button></div></form>'
      :'<h2>رمز الأهل</h2><p>أدخل الرمز السري المكوّن من 4 أرقام.</p><form id="pinForm"><input class="big" id="p1" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="الرمز السري"><p class="err" id="pe" role="alert"></p><div class="row"><button class="btn" type="submit">تأكيد</button><button class="btn ghost" type="button" id="pc">إلغاء</button></div></form>';
    openModal(html,function(){done(false)});
    document.getElementById('pc').onclick=function(){done(false)};
    document.getElementById('pinForm').onsubmit=function(ev){
      ev.preventDefault();
      var a=nd(document.getElementById('p1').value),err=document.getElementById('pe');
      if(!/^\d{4}$/.test(a)){err.textContent='اكتب 4 أرقام.';return}
      if(creating){
        var b=nd(document.getElementById('p2').value);
        if(a!==b){err.textContent='الرمزان غير متطابقين.';return}
        mutate(function(){state.pin=hashPin(a)});done(true);
      }else{
        if(hashPin(a)===state.pin){done(true)}else{err.textContent='الرمز غير صحيح.';document.getElementById('p1').value=''}
      }
    };
  });
}
function askPin(){return state.pin?pinDialog('verify'):pinDialog('create')}

/* ---------- rendering ---------- */
function renderHero(c){

}
function renderProgress(c){
  var segs='',marks='',i;
  for(i=0;i<REWARDS.length;i++){

    var p=Math.max(0,Math.min(1,(c.pts-lo)/(hi-lo)));
    segs+='<div class="seg" style="--c:'+r.c+'"><i style="width:'+(p*100).toFixed(1)+'%"></i></div>';
    marks+='<div class="mark" style="--c:'+r.tt+'"><b>'+(r.key==='final'?'38':r.th)+'</b><span>'+r.short+'</span></div>';
  }

}

function rowHTML(i){
  var s=LIST[i],e=E(s.num),st=status(i),k=Math.floor(i/BL);
  var meta=ayatTxt(s.ayat)+' · ×'+s.m+' · '+ptsTxt(s.pts);
  var info='',act='';
  if(st==='done'){
    info='سُمِّعت في '+fmt(e.r);
    act='<span class="tag ok">'+CHECK+'مسمَّعة</span>'+(blockPassed(k)?'':'<button class="link" data-act="undo" data-num="'+s.num+'">تراجع</button>');
  }else if(st==='ready'){
    info='جاهزة للتسميع أمام الأهل';
    act='<button class="btn alt" data-act="recite" data-num="'+s.num+'">'+LOCK+'اعتماد التسميع</button>'+'<button class="link" data-act="unready" data-num="'+s.num+'">'+'ليس بعد'+'</button>';
  }else if(st==='redo'){
    info='تُعاد بعد المراجعة';
    act='<span class="tag wait">تُعاد</span>'+'<button class="btn" data-act="ready" data-num="'+s.num+'">'+'أريد التسميع'+'</button>';
  }else if(st==='active'){
    act='<button class="btn" data-act="ready" data-num="'+s.num+'">'+'أريد التسميع'+'</button>';

}

function nextCard(c){

function pathCard(c){
  var rows=REWARDS.map(function(r){
    var un=unlocked(r,c),p=pctOf(r,c),l=un?(state.rw[r.key]?'استُلمت':'مفتوحة'):leftTxt(r,c).replace('تبقّى ','');

  }).join('');

function blockCard(){
  var k=curBlock();
  if(k<0)return'<section class="card"><h2>'+'اكتملت كل المجموعات</h2><p>تمّت مراجعة المجموعات الثماني لـ'+esc(P.child)+'. الحفلة الكبرى في الانتظار.</p></section>';
  var items=blockItems(k),rec=items.filter(function(s){return E(s.num).st===2}).length,ay=items.reduce(function(a,s){return a+s.ayat},0);
  var rows='',i;
  for(i=k*BL;i<k*BL+items.length;i++)rows+=rowHTML(i);
  var foot;
  if(rec===items.length){
    var u=state.b[k]&&state.b[k].u,left=u?daysBetween(today(),u):0;
    var hint=left>0
      ?'اكتملت السور. المراجعة الشاملة مقترحة بعد '+daysTxt(left)+' ('+fmt(u)+')، والقرار للأهل.'
      :'اكتملت السور. راجع السور مع '+esc(P.child)+'، أو افتح المجموعة التالية متى شئت.';
    var nextLbl=k<NB-1?'فتح المجموعة التالية':'إنهاء التحدّي';
    foot='<div class="foot"><span class="hint">'+hint+'</span><button class="btn" data-act="review" data-k="'+k+'">'+LOCK+'مراجعة المجموعة</button><button class="btn ghost" data-act="pass" data-k="'+k+'">'+LOCK+nextLbl+'</button></div>';
  }else{
    foot='<div class="foot"><span class="hint">'+rec+' من '+items.length+' سور مسمَّعة. بعد تسميعها كلها يقرّر الأهل فتح المجموعة التالية.</span></div>';
  }
  return'<section class="card blk"><h2>المجموعة '+(k+1)+' من '+NB+'</h2><div class="meta">'+sourTxt(items.length)+' · '+ayatTxt(ay)+'</div><div class="rows">'+rows+'</div>'+foot+'</section>';
}

function viewHome(){var c=calc();return nextCard(c)+blockCard()+pathCard(c)}

function viewAll(){
  var k,out='',cur=curBlock();
  for(k=0;k<NB;k++){
    var items=blockItems(k),rows='',i,tag;
    for(i=k*BL;i<k*BL+items.length;i++)rows+=rowHTML(i);

}

   ['اختيار سورة من المجموعة الحالية','السور مقسَّمة إلى مجموعات من 5 سور، من الأقصر إلى الأطول. داخل المجموعة اختر السورة التي يبدأ بها الطفل، أو دعه يختارها. لا تُفتح المجموعة التالية قبل إتمام السور الخمس، وفي النهاية تُحفظ السور الـ38 كلها.'],
   ['الضغط على «أنا جاهز»','عندما يشعر الطفل أنه حفظ السورة اطلب منه أن يضغط على الزر. تتحول البطاقة إلى اللون الأزرق وتنتظر تسميعه أمامك.'],
   ['التسميع أمام الوليّ','اطلب من الطفل أن يسمّع السورة عن ظهر قلب دون مساعدة. إذا أتقنها فاضغط «اعتماد التسميع» واكتب رمزك، فتُضاف النقاط فورًا. وإن تعثّر فاترك السورة جاهزة ودعه يحاول مرة أخرى.'],
   ['الانتقال إلى المجموعة التالية','عند اكتمال السور الخمس يقرّر الأهل وقت الانتقال. المراجعة الشاملة مقترحة بعد 7 أيام: اطلب من الطفل أن يسمّع السور كلها دون مساعدة، وعلّم السور التي تعثّر فيها لتُعاد وحدها. وإن رأيت الانتقال مباشرة فاضغط «فتح المجموعة التالية» واكتب رمزك، دون مراجعة.'],
   ['الجوائز','عندما تصل النقاط إلى جائزة تُفتح في قسم «الجوائز». أعطِ الجائزة للطفل ثم اضغط «تم استلامها» واكتب رمزك. في «مسيرتي» ترى نسبة القرب من كل جائزة. وعند التسجيل اكتب الجائزة التي تناسب أسرتك لكل عتبة من النقاط، ويمكنك تعديلها من قسم «الأهل».'],
   ['حفظ نسخة احتياطية','التقدّم محفوظ في متصفح الجهاز. استعمل دائمًا الجهاز والمتصفح نفسيهما، وانسخ نسخة احتياطية مرة كل شهر من قسم «الأهل».']
  ];
  return'<ol class="steps">'+st.map(function(x){return'<li><b>'+x[0]+'</b>'+x[1]+'</li>'}).join('')+'</ol>'
  +'<h3 style="margin-top:14px;font-weight:800;color:var(--teal);font-size:16px">كيف تُحسب النقاط؟</h3>'
  +'<table class="ptable"><tr><th>عدد الآيات</th><th>نقاط كل آية</th><th>مثال</th></tr><tr><td>من 1 إلى 14</td><td>نقطة</td><td>5 آيات = 5 نقاط</td></tr><tr><td>من 15 إلى 20</td><td>نقطتان</td><td>19 آية = 38 نقطة</td></tr><tr><td>21 فأكثر</td><td>3 نقاط</td><td>40 آية = 120 نقطة</td></tr></table>'
  +'<div class="gbox">مكافأة 50 نقطة عند السورة العاشرة والعشرين والثلاثين. النقاط تتراكم ولا تُنفق.</div>';
}
function viewGuide(){return'<section class="card"><h2>القواعد وطريقة العمل</h2>'+guideHTML()+'</section>'}
var VIEWS={home:viewHome,all:viewAll,rewards:viewRewards,parents:viewParents,guide:viewGuide};
function setSync(){
  var el=document.getElementById('sync'),msg='',warn=false;
  if(!P){msg=''}
  else if(!storageOK){msg='تعذّر الحفظ في هذا المتصفح. سيضيع التقدّم عند إغلاق الصفحة.';warn=true}
  else if(sync.ref){
    if(sync.err){msg='تعذّرت المزامنة الآن. التقدّم محفوظ على هذا الجهاز وستُعاد المحاولة.';warn=true}
    else if(!sync.ready)msg='جارٍ ربط التقدّم بحسابك…';
    else msg='التقدّم متزامن مع حسابك على كل أجهزتك.';
  }else{
    var c=calc(),stale=!store.lastBackup||daysBetween(store.lastBackup,today())>30;
    if(c.scored>=3&&stale){msg='انسخ نسخة احتياطية من قسم «الأهل» حتى لا يضيع التقدّم.';warn=true}
    else msg='التقدّم محفوظ على هذا الجهاز فقط.';
  }
  el.textContent=msg;el.className='sync'+(warn?' warn':'');el.hidden=!msg;
}
var viewMode='';try{viewMode=localStorage.getItem('juz-view')||''}catch(e){}
function isPC(){return viewMode?viewMode==='pc':window.innerWidth>=900}
function applyMode(){
  var pc=isPC();
  document.body.classList.toggle('pc',pc);document.body.classList.toggle('phone',!pc);
  var mv=document.querySelector('meta[name=viewport]');
  if(mv)mv.setAttribute('content',(viewMode==='pc'&&screen.width<900)?'width=1100':'width=device-width, initial-scale=1');
  Array.prototype.forEach.call(document.querySelectorAll('.mode button'),function(b){b.setAttribute('aria-pressed',(b.dataset.m==='pc')===pc?'true':'false')});
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest&&ev.target.closest('[data-act=mode]');
  if(!b)return;
  viewMode=b.dataset.m;try{localStorage.setItem('juz-view',viewMode)}catch(e){}
  render();window.scrollTo(0,0);
});
window.addEventListener('resize',function(){if(!viewMode){var was=document.body.classList.contains('pc');if(was!==isPC())render()}});
function kidsHTML(){
  if(!P)return'';
  return'<span class="kl">تغيير الطفل:</span>'+store.profiles.map(function(p){
    var on=p.id===P.id;
    return'<button type="button" data-act="switch" data-id="'+esc(p.id)+'" aria-pressed="'+(on?'true':'false')+'">'+(on?'<span id="whoName">'+esc(p.child)+'</span>':esc(p.child))+'</button>';
  }).join('')+'<button type="button" class="add" data-act="addchild">+ إضافة طفل</button><button type="button" class="rs" data-act="reset">البدء من جديد</button>';
}
function render(){
  applyMode();
  document.getElementById('kids').innerHTML=kidsHTML();
  document.body.classList.toggle('reg',!P||!P.rwSet);
  var c=calc();
  renderHero(c);
  if(!P){
    var vr=document.getElementById('view');vr.setAttribute('data-tab','reg');vr.innerHTML='<section class="card">'+regFormHTML(false)+'</section>';
    setSync();return;
  }
  if(!P.rwSet){var vs=document.getElementById('view');vs.setAttribute('data-tab','reg');vs.innerHTML=setupHTML();setSync();return}
  renderProgress(c);
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false')});
  var vw=document.getElementById('view');vw.setAttribute('data-tab',tab);vw.innerHTML=VIEWS[tab]();
  setSync();
}

/* ---------- registration / profiles / backup ---------- */
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='regForm')return;
  ev.preventDefault();
  var parent=document.getElementById('rgParent').value.trim(),child=document.getElementById('rgChild').value.trim();
  var pin=nd(document.getElementById('rgPin').value),pin2=nd(document.getElementById('rgPin2').value);
  var err=document.getElementById('rgErr');
  var bad=function(id,m){err.textContent=m;var e=document.getElementById(id);e.classList.add('bad');e.focus();err.scrollIntoView({block:'center'})};
  Array.prototype.forEach.call(document.querySelectorAll('#regForm input'),function(i){i.classList.remove('bad')});
  if(!parent){bad('rgParent','اكتب اسم الوليّ.');return}
  if(!child){bad('rgChild','اكتب اسم الطفل.');return}
  if(!/^\d{4}$/.test(pin)){bad('rgPin','الرمز يتكوّن من 4 أرقام.');return}
  if(pin!==pin2){bad('rgPin2','الرمزان غير متطابقين.');return}
  var p=fixProfile({id:uid(),parent:parent,child:child,pin:hashPin(pin),start:today(),ts:Date.now(),rwSet:false});
  store.profiles.push(p);setActive(p.id);saveStore();
  if(!document.getElementById('modal').hidden)closeModal();
  tab='home';render();window.scrollTo(0,0);
});
function openRegModal(){
  openModal('<div>'+regFormHTML(true)+'</div>');
  document.getElementById('rgCancel').onclick=closeModal;
}
function profilesModal(){
  openModal('<h2>الأطفال على هذا الجهاز</h2><div class="plist">'+store.profiles.map(function(p){
    return'<button class="btn'+(p.id===store.active?'':' ghost')+'" data-act="switch" data-id="'+esc(p.id)+'">'+esc(p.child)+' <small>· '+esc(p.parent)+'</small></button>';
  }).join('')+'</div><div class="row"><button class="btn ghost" data-act="addchild">تسجيل طفل جديد</button><button class="btn ghost" id="pcl">إغلاق</button></div>');
  document.getElementById('pcl').onclick=closeModal;
}
async function doBackup(){
  if(!(await askPin()))return;
  var text=JSON.stringify(store);
  store.lastBackup=today();saveStore();render();
  var ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
  if(ok){toast('تم نسخ النسخة الاحتياطية. الصقها في رسالة واحتفظ بها.');return}
  openModal('<h2>النسخة الاحتياطية</h2><p>انسخ النص كله والصقه في رسالة تحتفظ بها.</p><form class="form"><textarea id="bkText" readonly></textarea></form><div class="row"><button class="btn ghost" id="bkc">إغلاق</button></div>');
  var ta=document.getElementById('bkText');ta.value=text;ta.select();
  document.getElementById('bkc').onclick=closeModal;
}
async function doRestore(){
  if(!(await askPin()))return;
  openModal('<h2>استعادة من نسخة احتياطية</h2><p>الصق النص المحفوظ. الملفات التي لها نفس المعرّف تُستبدل بما في النسخة.</p><form id="rsForm" class="form"><textarea id="rsText" aria-label="النسخة الاحتياطية"></textarea><p class="err" id="rsErr" role="alert"></p><div class="row" style="display:flex;gap:10px"><button class="btn" type="submit">استعادة</button><button class="btn ghost" type="button" id="rsc">إلغاء</button></div></form>');
  document.getElementById('rsc').onclick=closeModal;
  document.getElementById('rsForm').onsubmit=function(ev){
    ev.preventDefault();
    var err=document.getElementById('rsErr'),o;
    try{o=JSON.parse(document.getElementById('rsText').value)}catch(e){err.textContent='النص غير صالح.';return}
    if(!o||o.v!==3||!Array.isArray(o.profiles)||!o.profiles.length){err.textContent='هذه ليست نسخة احتياطية صالحة.';return}
    o.profiles.map(fixProfile).forEach(function(p){
      p.ts=Date.now();delete store.dead[p.id];
      var at=-1;store.profiles.forEach(function(q,i){if(q.id===p.id)at=i});
      if(at>=0)store.profiles[at]=p;else store.profiles.push(p);
    });
    store.lastBackup=o.lastBackup||store.lastBackup;
    setActive(o.active&&store.profiles.some(function(p){return p.id===o.active})?o.active:store.profiles[0].id);
    saveStore();closeModal();tab='home';render();toast('تمت الاستعادة.');
  };
}

/* ---------- actions ---------- */
function celebrate(keys){
  if(!keys.length)return;
  var r=REWARDS.filter(function(x){return x.key===keys[keys.length-1]})[0];
  openModal('<h2>مبروك يا '+esc(P.child)+'!</h2><p>فُتحت جائزة جديدة:</p>'+artOf(r)+'<h3 style="font-family:var(--display);font-weight:400;font-size:28px;text-align:center;color:'+r.tt+'">'+r.name+'</h3><p style="text-align:center">'+r.sub+'</p><div class="row"><button class="btn" id="mok">رائع</button></div>');
  document.getElementById('mok').onclick=closeModal;
}
function idx(num){for(var i=0;i<LIST.length;i++){if(LIST[i].num===num)return i}return -1}

async function doRecite(num){
  if(!(await askPin()))return;
  var k=Math.floor(idx(num)/BL),before=unlockedKeys();
  mutate(function(){
    var e=state.s[num]||(state.s[num]={st:0});
    e.st=2;e.r=today();e.redo=false;if(!e.f)e.f=today();
    if(blockComplete(k)&&!(state.b[k]&&state.b[k].u)){state.b[k]=Object.assign(state.b[k]||{},{u:addDays(today(),GAP)})}
  });
  celebrate(unlockedKeys().filter(function(x){return before.indexOf(x)<0}));
}
async function doUndo(num){
  if(!(await askPin()))return;
  var k=Math.floor(idx(num)/BL);
  mutate(function(){
    var e=state.s[num];if(!e||e.st!==2)return;
    if(e.f===e.r){delete e.f;delete e.r;e.st=1}else{delete e.r;e.st=0;e.redo=true}
    if(state.b[k]&&!state.b[k].c&&!blockComplete(k)){delete state.b[k].u}
  });
}
async function doReview(k){
  if(!(await askPin()))return;
  var items=blockItems(k);
  openModal('<h2>مراجعة المجموعة '+(k+1)+'</h2><p>اطلب من '+esc(P.child)+' تسميع السور كلها دون مساعدة. علّم السور التي تحتاج إلى إعادة.</p><form id="rf">'+items.map(function(s){return'<label class="chk"><input type="checkbox" name="redo" value="'+s.num+'"><span class="nm">'+s.name+'</span><span>تُعاد</span></label>'}).join('')+'<div class="row" style="margin-top:6px"><button class="btn" type="submit">اعتماد المراجعة</button><button class="btn ghost" type="button" id="rc">إلغاء</button></div></form>');
  document.getElementById('rc').onclick=closeModal;
  document.getElementById('rf').onsubmit=function(ev){
    ev.preventDefault();
    var failed=Array.prototype.map.call(document.querySelectorAll('#rf input:checked'),function(x){return Number(x.value)});
    closeModal();
    var before=unlockedKeys();
    mutate(function(){
      if(!failed.length){state.b[k]=Object.assign(state.b[k]||{},{c:today()})}
      else failed.forEach(function(n){var e=state.s[n];e.st=0;e.redo=true});
    });
    if(failed.length){toast('تُعاد '+sourTxt(failed.length)+' قبل فتح المجموعة التالية.')}
    else{
      toast(k<NB-1?'تمّت مراجعة المجموعة! فُتحت المجموعة التالية.':'تمّت مراجعة المجموعة الأخيرة!');
      var added=unlockedKeys().filter(function(x){return before.indexOf(x)<0});
      if(added.length)setTimeout(function(){celebrate(added)},300);
    }
  };
}
async function doPass(k){
  if(!(await askPin()))return;
  var last=k>=NB-1;
  openModal('<h2>'+(last?'إنهاء التحدّي؟':'فتح المجموعة التالية؟')+'</h2><p>تُعدّ المجموعة '+(k+1)+' منتهية دون مراجعة شاملة'+(last?'.':'، وتُفتح المجموعة التالية الآن.')+' القرار للأهل، والنقاط لا تتغيّر.</p><div class="row"><button class="btn" id="py">'+(last?'نعم، أنهِ المجموعة':'نعم، افتح المجموعة التالية')+'</button><button class="btn ghost" id="pn">إلغاء</button></div>');
  document.getElementById('pn').onclick=closeModal;
  document.getElementById('py').onclick=function(){
    closeModal();
    var before=unlockedKeys();
    mutate(function(){state.b[k]=Object.assign(state.b[k]||{},{c:today(),skip:true})});
    toast(last?'انتهت المجموعة الأخيرة!':'فُتحت المجموعة '+(k+2)+'.');
    var added=unlockedKeys().filter(function(x){return before.indexOf(x)<0});
    if(added.length)setTimeout(function(){celebrate(added)},300);
  };
}
async function doClaim(key,on){
  if(!(await askPin()))return;
  mutate(function(){if(on)state.rw[key]=today();else delete state.rw[key]});
}
async function doEditRewards(){
  if(!(await askPin()))return;
  var vals={};
  REWARDS.forEach(function(r,i){var c=(state.rwc||{})[r.key];vals[r.key]=(c&&c.name)?c.name:BASE_REWARDS[i].name});
  openModal('<h2>تعديل الجوائز</h2><p>غيّر الجائزة عند كل عتبة من النقاط. عدد النقاط لا يتغيّر.</p><form id="rwForm" class="form">'+rwFieldsHTML('rn_',vals)+'<p class="err" id="rwErr" role="alert"></p><div class="row"><button class="btn" type="submit">حفظ</button><button class="btn ghost" type="button" id="rwSug">جوائز مقترحة</button><button class="btn ghost" type="button" id="rwX">إلغاء</button></div></form>');
  document.getElementById('rwX').onclick=closeModal;
  document.getElementById('rwSug').onclick=function(){rwFill('rn_')};
  document.getElementById('rwForm').onsubmit=function(ev){
    ev.preventDefault();
    var n=rwCollect('rn_');
    if(!n){markEmpty('rn_','rwErr');return}
    closeModal();
    mutate(function(){state.rwc=n});applyRewards();render();toast('تم حفظ الجوائز.');
  };
}
async function doChangePin(){
  if(!(await askPin()))return;
  if(await pinDialog('create'))toast('تم حفظ الرمز الجديد.');
}
async function doReset(){
  if(!(await askPin()))return;
  openModal('<h2>البدء من جديد؟</h2><p>يُمسح كل تقدّم '+esc(P.child)+' وتُمسح الجوائز، ثم تكتب الجوائز من جديد. لا يمكن التراجع عن هذا الإجراء.</p><div class="row"><button class="btn danger" id="ry">نعم، ابدأ من جديد</button><button class="btn ghost" id="rn">إلغاء</button></div>');
  document.getElementById('rn').onclick=closeModal;
  document.getElementById('ry').onclick=function(){closeModal();mutate(function(){state.s={};state.b={};state.rw={};state.rwc={};state.rwSet=false;state.start=today()});applyRewards();tab='home';render();window.scrollTo(0,0)};
}
async function doDelProfile(){
  if(!(await askPin()))return;
  openModal('<h2>حذف ملف '+esc(P.child)+'؟</h2><p>يُحذف التقدّم كله من هذا الجهاز. انسخ نسخة احتياطية قبل ذلك إن أردت الاحتفاظ به.</p><div class="row"><button class="btn danger" id="dy">نعم، احذف</button><button class="btn ghost" id="dn">إلغاء</button></div>');
  document.getElementById('dn').onclick=closeModal;
  document.getElementById('dy').onclick=function(){
    var id=P.id;
    store.dead[id]=Date.now();
    store.profiles=store.profiles.filter(function(p){return p.id!==id});
    setActive(store.profiles.length?store.profiles[0].id:'');
    saveStore();closeModal();tab='home';render();
  };
}

function markReady(num){
  if(mutate(function(){var e=state.s[num]||(state.s[num]={st:0});e.st=1}))toast('ما شاء الله! حان وقت التسميع أمام الأهل ليعتمدوا النقاط.');
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b){
    var row=ev.target.closest('.sur[data-tap]');
    if(row&&!ev.target.closest('a,button,input,label'))markReady(Number(row.dataset.num));
    return;
  }
  if(b.disabled)return;
  var a=b.dataset.act,num=Number(b.dataset.num),key=b.dataset.key,k=Number(b.dataset.k);
  if(a==='tab'){tab=b.dataset.tab;try{history.replaceState(null,'','#'+tab)}catch(e){}render();window.scrollTo(0,0);return}
  if(a==='ready'){markReady(num)}
  else if(a==='unready'){mutate(function(){var e=state.s[num];if(e&&e.st===1){e.st=0}})}
  else if(a==='recite')doRecite(num);
  else if(a==='undo')doUndo(num);
  else if(a==='review')doReview(k);
  else if(a==='pass')doPass(k);
  else if(a==='claim')doClaim(key,true);
  else if(a==='unclaim')doClaim(key,false);
  else if(a==='changepin')doChangePin();
  else if(a==='editrw')doEditRewards();
  else if(a==='reset')doReset();
  else if(a==='delprofile')doDelProfile();
  else if(a==='backup')doBackup();
  else if(a==='restore')doRestore();
  else if(a==='profiles')profilesModal();
  else if(a==='addchild')openRegModal();
  else if(a==='switch'){setActive(b.dataset.id);saveStore();closeModal();tab='home';render();window.scrollTo(0,0)}
});

/* ---------- start ---------- */
window.addEventListener('error',function(e){
  try{var d=document.getElementById('jserr');if(!d){d=document.createElement('div');d.id='jserr';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#9B2226;color:#fff;padding:8px 12px;font:13px/1.4 sans-serif;direction:ltr;text-align:left';document.body.appendChild(d)}d.textContent='Erreur: '+(e.message||'')+' (ligne '+(e.lineno||'?')+')'}catch(x){}
});
function startFrom(h){var t=(h||'').replace('#','');if(VIEWS[t])tab=t}
startFrom(location.hash);
window.addEventListener('hashchange',function(){startFrom(location.hash);render()});
applyRewards();
loadStore();
setActive(store.profiles.some(function(p){return p.id===store.active})?store.active:(store.profiles[0]?store.profiles[0].id:''));
render();
initSync();
})();
</script>
